# XcodeGen の設定。`xcodegen` で Dosei.xcodeproj を作る。
#
# iPhone と Mac を 1 つのターゲット（マルチプラットフォーム）で作る。
# 実行先を「iPhone」か「My Mac」に切り替えるだけでよい。
name: Dosei

options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: ja

packages:
  DoseiCore:
    path: Packages/DoseiCore

targets:
  Dosei:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Shared
      - path: App/iOS
        destinationFilters: [iOS]   # HealthKit は iPhone のみ
    dependencies:
      - package: DoseiCore
    scheme: {}   # CI の xcodebuild -scheme Dosei 用
    settings:
      base:
        DEVELOPMENT_TEAM: "NJ69566W75"
        BUNDLE_ID: "dev.arata-nvm.dosei"
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID)"
        PRODUCT_NAME: "Dosei"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "動静"
        # 使う暗号は HTTPS だけなので輸出規制の申告は不要（TestFlight に上げるたびに聞かれないように）
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

        # 「My Mac (Designed for iPad)」や Catalyst の実行先を出さない
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"

        # iPhone
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": App/Config/iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/Config/iOS.entitlements
        "INFOPLIST_FILE[sdk=iphoneos*]": App/Config/iOS-Info.plist
        "INFOPLIST_FILE[sdk=iphonesimulator*]": App/Config/iOS-Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Apple Watch の睡眠とワークアウトから、起床・就寝・移動の時刻を日記に入れるために使います。"
        # 書き込みはしないが、HealthKit の entitlements があると説明文が必須（ITMS-90683）
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "動静はヘルスケアにデータを書き込みません。睡眠とワークアウトを読み取るだけです。"

        # Mac
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Config/macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.lifestyle"
