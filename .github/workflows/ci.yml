name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v4
      - name: swift format lint
        run: swift format lint --strict --recursive App Packages

  test:
    name: Test (DoseiCore)
    runs-on: ubuntu-latest
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: Packages/DoseiCore
        run: swift test

  build:
    name: Build (${{ matrix.platform }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS Simulator
          - platform: macOS
            destination: generic/platform=macOS
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen
      - name: xcodebuild
        run: |
          xcodebuild build \
            -project Dosei.xcodeproj \
            -scheme Dosei \
            -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
